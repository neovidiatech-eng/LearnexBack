name: 🚀 LearnX Backend Production Deployment (Manual)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  pre_deployment_ci:
    name: 🔍 Pre-Deployment Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ✅ Validate Prisma Schema
        run: npx prisma validate --schema=./prisma/schema

      - name: 🔧 Generate Prisma Client
        run: npx prisma generate --schema=./prisma/schema

      - name: 🔬 JavaScript Syntax Integrity Check
        run: find src -name "*.js" -exec node --check {} +

      - name: 🧪 Run Automated Tests
        run: npm test

  deploy:
    name: 🚀 Authorized Server Deployment
    needs: pre_deployment_ci
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd /backend/LearnxBack

            git pull origin main

            docker compose up -d --build

            docker compose exec -T app npx prisma migrate deploy --schema=./prisma

            docker image prune -f

            docker compose ps
